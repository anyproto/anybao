[project]
name = "anybao"
version = "0.0.1"
description = "Agent harness: toolcaller loop, triggers, history/memory, any HTTP client"
requires-python = ">=3.13"
dependencies = [
    "anyrt",
    "croniter>=6.2.3",
]

[project.scripts]
anybao = "anybao.cli:main"

[tool.uv.sources]
anyrt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anybao"]
