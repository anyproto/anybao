name: release

# Fan-out / fan-in (same shape as any's _build-any.yml): verify → build
# matrix (one job per platform) → publish ONE release with every asset.
# Unlike any's Go backend (CGO-free, cross-compiles all desktop targets
# from ubuntu), anyrt is Rust — darwin builds need an Apple toolchain, so
# each platform builds natively on its own runner.
on:
  push:
    tags: ["v*"]

# Only the publish job creates the release; build jobs are read-only.
permissions:
  contents: read

jobs:
  # tags fire regardless of branch — only release tags cut from main
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} is not on main; refusing to release" >&2
            exit 1
          }
      # The tag sets the anyrt version (build + bump-main), so it must be one.
      - name: verify tag is vX.Y.Z
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z; refusing to release" >&2
            exit 1
          }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
          - runner: macos-15
            target: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Stock toolchains, deliberately NOT `nix develop`: linking inside
      # the devshell bakes /nix/store/... install names (libiconv) into
      # the darwin binary, and dyld aborts on user machines where no
      # store exists (#2). The build needs only uv + python 3.14
      # (componentize-py -> kernel.wasm) and the rust channel pinned in
      # rust-toolchain.toml — rustls-only, no native libs, kernel
      # embedded via include_bytes!.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - id: rust
        run: echo "toolchain=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/Cargo.lock') }}
      # The tag is the version: anyrt reports CARGO_PKG_VERSION (election,
      # any-ui), and the tagged commit may still carry the previous one.
      - run: tools/set_version.sh "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: make licenses-check
      # builds bin/kernel.wasm first; the binary embeds it via include_bytes!
      - run: make runtime
      # the shipped binary must at least load on a bare runner — this is
      # exactly where the v0.1.1 darwin asset would have failed
      - run: runtime/target/release/anyrt --help > /dev/null
      - name: package
        run: |
          mkdir -p dist
          cp runtime/target/release/anyrt dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -R licenses dist/
          mkdir -p dist/runtime/guest
          cp -R runtime/guest/licenses dist/runtime/guest/
          cp runtime/guest/VENDORED.md dist/runtime/guest/
          tar -C dist -czf "anyrt-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            anyrt LICENSE THIRD_PARTY_NOTICES.md licenses runtime
          uv run --locked python tools/check_licenses.py \
            --archive "anyrt-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: anyrt-${{ matrix.target }}
          path: anyrt-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # checksums computed here, in one place, so every platform's .sha256
      # comes from the same sha256sum invocation (macs lack sha256sum)
      - name: checksums
        run: |
          cd artifacts
          for f in anyrt-*.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/anyrt-*.tar.gz
            artifacts/anyrt-*.tar.gz.sha256
          generate_release_notes: true

  # Carry the released version to main: any-ui nightly embeds anybao main,
  # not the tag. Runs after publish, so a failed release leaves main as is.
  bump-main:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: commit the released version to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main can move during the run: retry on a rejected push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            current=$(sed -nE '/^\[package\]/,/^\[/{s/^version *= *"([^"]+)".*/\1/p;}' runtime/Cargo.toml | head -n1)
            newest=$(printf '%s\n%s\n' "$current" "${GITHUB_REF_NAME#v}" | sort -V | tail -n1)
            if [ "$newest" = "$current" ]; then
              echo "main is at ${current}, not older than ${GITHUB_REF_NAME}; nothing to do"
              exit 0
            fi
            tools/set_version.sh "$GITHUB_REF_NAME"
            git commit -am "anyrt: version ${GITHUB_REF_NAME#v}"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt ${attempt}); retrying" >&2
          done
          exit 1
