name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: cargo-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
      - run: nix develop -c uv sync
      - run: nix develop -c make kernel
      - run: nix develop -c uv run ruff check .
      - run: nix develop -c cargo test --manifest-path runtime/Cargo.toml
      # build the binary so the rt_e2e subprocess test runs (else it skips)
      - run: nix develop -c make runtime
      - run: nix develop -c uv run pytest

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: cargo-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
      - run: nix develop -c make runtime-check
      - run: nix develop -c make runtime
      # the vendored any spec vs the coverage manifest (ADR-002 §2)
      - run: nix develop -c make api-drift
