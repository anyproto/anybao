name: ci

on:
  push:
    branches: [main]
  pull_request:

# Stock toolchains, not `nix develop` (same as release.yml): the tree
# needs only uv + python 3.13 (componentize-py -> kernel.wasm) and
# stable rust — rustls-only, no native libs. The flake stays the local
# dev shell; both it and the workflows take the rust channel from
# rust-toolchain.toml, so the two can't drift apart silently.
#
# Action majors: checkout v7 / cache v6 / setup-uv v10 are the node24
# builds (older majors are forced onto node24 by the runner and warn on
# every step). setup-uv publishes no floating major tag since v8 — pin
# the full version and bump it by hand.
#
# Every cargo step goes through a Makefile target that depends on
# `kernel`, so bin/kernel.wasm (include_bytes! into the binary) is built
# exactly when needed and never as a step of its own. `uv run` syncs the
# venv itself.
#
# Cargo caches are keyed per job (and per feature leg): actions/cache
# never rewrites an existing key, so a key shared between jobs froze
# whichever job saved first — the runtime job's clippy+release tree —
# and the test job recompiled every crate on every run. The `stock-`
# salt keeps them apart from the trees the nix-develop era saved:
# those build scripts were linked against the /nix/store loader and
# ENOENT on a bare runner even though cargo's fingerprints match.

jobs:
  test:
    name: test-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: shell
            features: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - id: rust
        run: echo "toolchain=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: cargo-stock-test-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
      - run: make test-runtime FEATURES=${{ matrix.features }}
      - if: matrix.name == 'default'
        run: uv run ruff check .

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - id: rust
        run: echo "toolchain=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: cargo-stock-runtime-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
      - run: make runtime-check
      - run: make runtime
      # the vendored any spec vs the coverage manifest (ADR-002 §2)
      - run: make api-drift
      # guest-module + wire pytest; rt_e2e drives the release binary
      # built above (it skips without one). Lives here rather than in a
      # test leg so no job carries a debug test tree AND a release tree:
      # that pair overflowed the runner disk while tarring the cache.
      - run: uv run pytest
