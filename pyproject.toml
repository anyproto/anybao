# Virtual workspace root — the packages live in runtime/ (anyrt) and
# harness/ (anybao). Import direction: anybao → anyrt, never back.
[tool.uv.workspace]
members = ["runtime", "harness"]

[dependency-groups]
dev = [
    "componentize-py>=0.24.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["runtime/tests", "harness/tests"]
# Offline by default (`-m "not integration"`); integration tests hit a
# real any server and are opt-in via `-m integration`.
addopts = "-q --import-mode=importlib -m 'not integration'"
markers = [
    "integration: hits a real any server (skipped without one; run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
