# No Python packages live here anymore — the runtime is Rust (runtime/,
# binary anyrt). Python remains only for the componentized guest kernel
# build (componentize-py) and the guest-module + wire tests under tests/.
# `[project]` exists so uv has a `requires-python` (without it, every
# `uv run` / `uv sync` warns and defaults to `>=3.13` from the active
# interpreter). `package = false` keeps this a non-package workspace.

[project]
name = "anybao"
version = "0.0.0"
requires-python = ">=3.13"
license = "MIT"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "componentize-py>=0.24.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "repos/_connectors/tests"]
# Offline by default (`-m "not integration"`); integration tests hit a
# real any server and are opt-in via `-m integration`.
addopts = "-q -m 'not integration'"
markers = [
    "integration: hits a real any server (skipped without one; run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# vendored guest libraries (ADR-012 §6) are upstream code — never linted
extend-exclude = [
    "tests/fixtures",   # fixture INPUTS (bench generator scripts, goldens) — not code
    "runtime/guest/bs4",
    "runtime/guest/soupsieve",
    "runtime/guest/markdownify",
    "runtime/guest/six.py",
    "runtime/guest/typing_extensions.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
