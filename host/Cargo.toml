[package]
name = "anybao-host"
version = "0.1.0"
edition = "2021"
description = "The anybao host: wasmtime cage + the syscall surface (ADR-002 thin host)"

[dependencies]
# pinned to the wasmtime-py major the Python reference host embeds
wasmtime = { version = "46", features = ["component-model"] }
wasmtime-wasi = "46"
serde_json = "1"          # default Map = BTreeMap → sorted keys = canonical JSON
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
