[project]
name = "anyrt"
version = "0.0.1"
description = "Isolated runtime: effect boundary, trace/replay, cell executor, space module loader"
requires-python = ">=3.13"
dependencies = [
    "wasmtime>=46.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyrt"]
