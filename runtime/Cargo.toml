[package]
name = "anyrt"
version = "0.1.0"
edition = "2021"
description = "anyrt — the anybao runtime: wasmtime cage + the syscall surface (ADR-002)"

[dependencies]
# pinned to the wasmtime-py major the Python reference host embeds
wasmtime = { version = "46", features = ["component-model"] }
wasmtime-wasi = "46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"          # default Map = BTreeMap → sorted keys = canonical JSON
toml = "0.8"              # anybao.toml host config (ADR-009 §1)
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
cron = "0.12"            # trigger cron expressions (every_s needs nothing)
chrono = "0.4"           # cron's time source
tiny_http = "0.12"       # the localhost trigger control API
tracing = "0.1"          # runtime logs (embedders subscribe or get silence)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # bin-side fmt

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
