# Host config for the NIGHTLY channel: the repo spaces nightly any-ui
# builds point at, deployed by .github/workflows/deploy-repos.yml after
# every successful nightly (prerelease) any-ui release. Same shape as
# anybao.toml (the stable channel); the invites are public read-only
# guest keys. Owner: the nightly repo account (deploy/nightly.account).
# The spaces carry the stable names (_agentrepo, _connectorsrepo) — any-ui
# hides repo spaces by name; the ids tell the channels apart.
