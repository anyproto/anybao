# Prefer permissive alternatives and keep every term in compound AND expressions.
accepted = [
    "Apache-2.0 WITH LLVM-exception", "Apache-2.0", "MIT", "BSD-3-Clause",
    "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0",
    "0BSD", "Unlicense",
]
ignore-dev-dependencies = true


# Preserve libm's complete composite license and attribution text.
[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"

# ittapi omits LICENSES/ from its crate archive; retain the upstream BSD notice.
[ittapi.clarify]
license = "BSD-3-Clause"

[[ittapi.clarify.git]]
path = "LICENSES/BSD-3-Clause.txt"
license = "BSD-3-Clause"
checksum = "cf48cdd9ed87c2031b68fb1b9f4cfb55d00dcf815b21a30bf8304aa1e5e6f76a"
